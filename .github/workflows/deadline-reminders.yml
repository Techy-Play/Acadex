name: Deadline Reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing APP_URL or CRON_SECRET GitHub secret"
            exit 1
          fi

          RESPONSE=$(curl --fail --show-error --silent --location \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "x-api-key: $CRON_SECRET" \
            "$APP_URL/api/jobs/deadline-reminders")

          echo "Reminder job response: $RESPONSE"
